<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- GHOST Protocol — Canonical Master Vector Mark -->
  <!-- Mathematical Geometry: Equilateral 3-node mesh triad with an aerodynamic negative-space ghost trajectory -->
  <defs>
    <!-- Negative-Space Trench Mask: ensures clean optical separation across all surfaces -->
    <mask id="ghostTrenchMask">
      <rect width="512" height="512" fill="#FFFFFF" />
      <g fill="none" stroke="#000000" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
        <line x1="256" y1="110" x2="130" y2="335" />
        <line x1="256" y1="110" x2="382" y2="335" />
        <line x1="130" y1="335" x2="382" y2="335" />
        <line x1="256" y1="110" x2="256" y2="335" stroke-width="28" />
      </g>
      <circle cx="256" cy="110" r="34" fill="#000000" />
      <circle cx="130" cy="335" r="30" fill="#000000" />
      <circle cx="382" cy="335" r="30" fill="#000000" />
      <circle cx="256" cy="335" r="20" fill="#000000" />
    </mask>
  </defs>

  <g id="ghost-master-mark">
    <!-- Aerodynamic Ghost Shroud / Trajectory (Ghost Primary #9D4EDD) -->
    <path d="M 256 110
             C 288 165, 306 225, 292 290
             C 280 340, 268 380, 256 425
             C 244 380, 232 340, 220 290
             C 206 225, 224 165, 256 110 Z"
          fill="#9D4EDD"
          mask="url(#ghostTrenchMask)" />

    <!-- Peer-to-Peer Mesh Channels (Ghost Light #C77DFF) -->
    <g fill="none" stroke="#C77DFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
      <line x1="256" y1="110" x2="130" y2="335" />
      <line x1="256" y1="110" x2="382" y2="335" />
      <line x1="130" y1="335" x2="382" y2="335" />
    </g>

    <!-- Central Transmission Trajectory (Dual-Tone Engineered Signal Spine) -->
    <line x1="256" y1="110" x2="256" y2="335" stroke="#C77DFF" stroke-width="16" stroke-linecap="round" />
    <line x1="256" y1="110" x2="256" y2="335" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />

    <!-- Solid Circular Peer Nodes (Universal Contrast: Pure White with Deep Violet Rim) -->
    <!-- Apex Node: Origin Transmitter -->
    <circle cx="256" cy="110" r="26" fill="#FFFFFF" stroke="#4C1D95" stroke-width="4" />
    <!-- Port Relay Node -->
    <circle cx="130" cy="335" r="22" fill="#FFFFFF" stroke="#4C1D95" stroke-width="3.5" />
    <!-- Starboard Relay Node -->
    <circle cx="382" cy="335" r="22" fill="#FFFFFF" stroke="#4C1D95" stroke-width="3.5" />

    <!-- Central Routing Nexus (Ghost Deep #4C1D95 with Pure White rim) -->
    <circle cx="256" cy="335" r="13" fill="#4C1D95" stroke="#FFFFFF" stroke-width="4" />
  </g>
</svg>
